[build-system]
requires = ["setuptools==75.3.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maps-experiments"
version = "0.0.1"
description = "Frozen reproduction artifacts for MAPS paper experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.1.2",
  "onnx==1.20.1",
  "onnxruntime==1.23.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["maps_experiments*"]
