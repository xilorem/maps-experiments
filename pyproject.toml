[build-system]
requires = ["setuptools==75.3.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maps-experiments"
version = "0.0.1"
description = "Frozen reproduction artifacts for MAPS paper experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.1.2",
  "onnx==1.20.1",
  "coloredlogs==15.0.1",
  "flatbuffers==25.12.19",
  "humanfriendly==10.0",
  "maps-experiments==0.0.1",
  "markdown-it-py==4.2.0",
  "mdurl==0.1.2",
  "ml_dtypes==0.6.0",
  "mpmath==1.3.0",
  "numpy==2.1.2",
  "onnx==1.20.1",
  "onnxruntime==1.23.2",
  "packaging==26.3",
  "pexpect==4.9.0",
  "prettytable==3.18.0",
  "protobuf==7.35.1",
  "psutil==7.2.2",
  "ptyprocess==0.7.0",
  "pyelftools==0.33",
  "Pygments==2.21.0",
  "PyYAML==6.0.3",
  "rich==15.0.0",
  "six==1.17.0",
  "sympy==1.14.0",
  "typing_extensions==4.16.0",
  "wcwidth==0.8.2",
]

[tool.setuptools]
py-modules = []

[tool.pyright]
venvPath = "."
venv = ".venv"
